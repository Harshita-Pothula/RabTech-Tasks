<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopfront</title>
  <meta name="description" content="Shopfront: an accessible e-commerce storefront with accounts, cart, checkout, order tracking and an admin dashboard.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#23272b">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fakestoreapi.com" crossorigin>
  <link rel="preload" href="fonts/public-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#app">Skip to main content</a>

  <header class="site-header">
    <a class="brand" href="#/">
      <span class="brand__name">Shopfront</span>
      <span class="brand__tag">Capstone store</span>
    </a>

    <nav class="main-nav" aria-label="Main">
      <ul>
        <li><a href="#/" data-nav="shop">Shop</a></li>
        <li data-show="admin" hidden><a href="#/admin" data-nav="admin">Admin</a></li>
        <li data-show="user" hidden><a href="#/account" data-nav="account">Account</a></li>
        <li data-show="guest"><a href="#/signin" data-nav="account">Sign in</a></li>
      </ul>
    </nav>

    <div class="header-actions">
      <button class="button button--ghost theme-toggle" type="button"><span class="theme-toggle__label">Dark theme</span></button>
      <a class="button cart-link" href="#/cart" data-nav="cart">
        Cart <span id="cart-count" class="cart-count">0</span><span id="cart-count-label" class="visually-hidden"> items</span>
      </a>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <p class="loading-note">Loading Shopfront…</p>
    <noscript><p class="banner banner--error">Shopfront needs JavaScript. Turn it on and reload the page.</p></noscript>
  </main>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <footer class="site-footer">
    <p>Shopfront, a capstone project. Product data from <a href="https://fakestoreapi.com/">FakeStoreAPI</a>; accounts and orders are stored only in this browser.</p>
    <p><button class="link-button" type="button" data-reset-demo>Reset demo data</button></p>
  </footer>
</body>
</html>
